name: Verify & Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies, typecheck, and build
        working-directory: .
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Deploy Frontend to Vercel
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN}" || -z "${VERCEL_ORG_ID}" || -z "${VERCEL_PROJECT_ID}" ]]; then
            echo "::error::Missing required GitHub Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be configured."
            exit 1
          fi

      - name: Install dependencies & Vercel CLI
        run: |
          npm ci
          npm install --global vercel@latest

      - name: Pull Vercel production environment configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build Vercel production bundle
        env:
          GH_VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || vars.VITE_API_BASE_URL }}
        run: |
          if [[ -n "${GH_VITE_API_BASE_URL}" ]]; then
            export VITE_API_BASE_URL="${GH_VITE_API_BASE_URL}"
          fi
          export VITE_API_FALLBACK_TO_MOCK="false"
          vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy prebuilt artifacts to Vercel
        id: vercel_deploy
        run: |
          DEPLOY_URL="$(vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${DEPLOY_URL}" >> "${GITHUB_OUTPUT}"
          {
            echo "## JobConnect Frontend Deployment (Vercel)"
            echo "- **Production URL:** ${DEPLOY_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
