# Auto-load local .env if present (never commit real .env files)
spring.config.import=optional:file:.env[.properties]

# Server (honors Cloud Run PORT env var first, then SERVER_PORT, then 8080)
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# MySQL 8 Datasource (credentials read strictly from environment variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobconnect}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Schema managed by Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Multipart File Uploads (Max 10MB for PDF/DOCX resumes)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Application Security & JWT Settings
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.cookie-name=${JWT_COOKIE_NAME:jobconnect_jwt}
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Google OAuth 2.0 Client (Authorization Code Flow)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:unconfigured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:unconfigured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Frontend OAuth2 Redirect & CORS
app.oauth2.frontend-redirect-uri=${APP_FRONTEND_AUTH_REDIRECT_URI:http://localhost:5173/oauth/callback}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,https://ais-*.run.app}
app.upload.dir=${APP_UPLOAD_DIR:./storage/resumes}

# Transactional Email Notifications (SMTP credentials via environment variables)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:no-reply@jobconnect.app}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
