# Production Profile (SPRING_PROFILES_ACTIVE=prod) - Render Backend + Vercel Frontend

# Honor Render / container injected PORT environment variable and HTTPS proxy headers
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework

# Existing MySQL 8 Datasource:
# Supports either explicit DB_URL (full JDBC connection string)
# or standard DB_HOST / DB_PORT / DB_NAME variables.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:jobconnect}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:true}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}&serverTimezone=UTC}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=600000
spring.jpa.properties.hibernate.format_sql=false

# Secure HttpOnly Cookies for Cross-Origin Vercel + Render HTTPS Domains
# Use SameSite=None when frontend (Vercel) and backend (Render) are on different HTTPS origins,
# or SameSite=Lax if served behind a single custom domain / reverse proxy.
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
app.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:None}

# Strict Google OAuth2 Environment Variables (no hardcoded defaults in prod)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# Production HTTPS Frontend Redirect & CORS Origins
# Supports either APP_FRONTEND_AUTH_REDIRECT_URI + APP_CORS_ALLOWED_ORIGINS or FRONTEND_URL
app.oauth2.frontend-redirect-uri=${APP_FRONTEND_AUTH_REDIRECT_URI:${FRONTEND_URL}/oauth/callback}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL}}

# Writable resume upload directory in container (/tmp is always writable)
app.upload.dir=${APP_UPLOAD_DIR:/tmp/jobconnect/resumes}
