name: Verify & Deploy Backend to Render

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Spring Boot Maven Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Spring Boot unit & security tests
        working-directory: backend
        run: mvn test -B

      - name: Verify Spring Boot production JAR package
        working-directory: backend
        run: mvn package -DskipTests -B

  deploy:
    name: Trigger Render Backend Deployment
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL }}
        run: |
          if [[ -z "${RENDER_DEPLOY_HOOK_URL}" ]]; then
            echo "::error::Missing required GitHub Secret: RENDER_DEPLOY_HOOK_URL must be configured from your Render Web Service Settings."
            exit 1
          fi

          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Render deployment triggered successfully."

          {
            echo "## JobConnect Backend Deployment (Render)"
            echo "- Render deployment hook triggered after Maven tests and packaging passed."
            if [[ -n "${RENDER_BACKEND_URL}" ]]; then
              CLEAN_URL="${RENDER_BACKEND_URL%/}"
              echo "- **Backend URL:** ${CLEAN_URL}"
              echo "- **Health Endpoint:** ${CLEAN_URL}/api/health"
              echo "- **Google OAuth Redirect URI:** \`${CLEAN_URL}/login/oauth2/code/google\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
