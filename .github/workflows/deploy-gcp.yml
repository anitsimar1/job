name: Deploy JobConnect to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      region:
        description: Google Cloud region
        required: false
        default: asia-northeast1

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Verify Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Spring Boot unit & security tests
        working-directory: backend
        run: mvn test -B

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Typecheck and build React frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    name: Build & Deploy via Cloud Build + Cloud Run
    needs: verify
    runs-on: ubuntu-latest
    env:
      GCP_REGION: ${{ github.event.inputs.region || vars.GCP_REGION || 'asia-northeast1' }}
      GCP_AR_REPO: ${{ vars.GCP_AR_REPO || 'jobconnect' }}
      GCP_SQL_INSTANCE: ${{ vars.GCP_SQL_INSTANCE || 'jobconnect-mysql' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build pipeline (Artifact Registry + Cloud Run + Cloud SQL)
        run: |
          gcloud builds submit . \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ env.GCP_REGION }}" \
            --config=cloudbuild.yaml \
            --substitutions="_REGION=${{ env.GCP_REGION }},_AR_REPO=${{ env.GCP_AR_REPO }},_SQL_INSTANCE=${{ env.GCP_SQL_INSTANCE }},_IMAGE_TAG=${{ github.sha }}"

      - name: Verify live Cloud Run endpoints & print OAuth URI
        run: |
          BACKEND_URL="$(gcloud run services describe jobconnect-backend --project="${{ secrets.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"
          FRONTEND_URL="$(gcloud run services describe jobconnect-frontend --project="${{ secrets.GCP_PROJECT_ID }}" --region="${{ env.GCP_REGION }}" --format='value(status.url)')"

          curl -fsS "${BACKEND_URL}/api/health"
          curl -fsS -o /dev/null "${FRONTEND_URL}"

          {
            echo "## JobConnect Cloud Run Deployment"
            echo "- **Frontend URL:** ${FRONTEND_URL}"
            echo "- **Backend URL:** ${BACKEND_URL}"
            echo "- **Health Check:** ${BACKEND_URL}/api/health"
            echo "- **Google Cloud Console Authorized Redirect URI:** \`${BACKEND_URL}/login/oauth2/code/google\`"
          } >> "${GITHUB_STEP_SUMMARY}"
